name: Publish completed ELPA submissions

on:
  issues:
    types: [opened, closed, reopened]

concurrency:
  group: elpa-question-bank-publication
  queue: max

permissions:
  contents: read
  issues: read

jobs:
  review:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.issue.title, '[ELPA 投稿]') }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Create Source-scoped GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: HKUST-ELPA
          repositories: HKUST-ELPA-Site-Source
          permission-contents: write
          permission-issues: write
          permission-members: read
      - name: Resolve GitHub App bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Confirm issue was created by the submission App
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ISSUE_AUTHOR,,}" != "${APP_SLUG,,}[bot]" ]]; then
            echo "Issue creator is not the submission App" >&2
            exit 1
          fi
      - name: Checkout routing source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate signed submission domain and resolve team
        id: route
        env:
          ELPA_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
        run: node scripts/review-routing.cjs
      - name: Ensure review labels
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh label create submission:pending --color fbca04 --description "Awaiting designated team review" --force
          gh label create submission:published --color 0e8a16 --description "Included in Source main" --force
          gh label create submission:failed --color b60205 --description "Publication or validation failed" --force
          for label in campus:gz campus:hk track:regular track:fast-track; do
            gh label create "$label" --color 1d76db --description "ELPA review domain" --force
          done
      - name: Route new submission to its team
        if: ${{ github.event.action == 'opened' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_TEAM: ${{ steps.route.outputs.team }}
          REVIEW_CAMPUS: ${{ steps.route.outputs.campus }}
          REVIEW_TRACK: ${{ steps.route.outputs.track }}
          ELPA_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --add-label "submission:pending,campus:${REVIEW_CAMPUS},track:${REVIEW_TRACK}"
          if gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq '<!-- elpa-review-notification-v1 -->'; then
            echo "Review notification already sent; skipping duplicate"
            exit 0
          fi
          node scripts/render-review-notification.cjs "$GITHUB_EVENT_PATH" /tmp/elpa-review-notification.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/elpa-review-notification.md
      - name: Authorize completed review
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' }}
        id: authorization
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_TEAM: ${{ steps.route.outputs.team }}
          CLOSING_USER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          authorized=false
          role=$(gh api "/orgs/HKUST-ELPA/memberships/${CLOSING_USER}" --jq '.role' 2>/dev/null || true)
          if [[ "$role" == admin ]]; then
            authorized=true
          else
            member=$(gh api "/orgs/HKUST-ELPA/teams/${REVIEW_TEAM}/memberships/${CLOSING_USER}" --jq '.state' 2>/dev/null || true)
            if [[ "$member" == active ]]; then authorized=true; fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
      - name: Reject unauthorized approval
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && steps.authorization.outputs.authorized != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue reopen "$ISSUE_NUMBER"
          gh issue comment "$ISSUE_NUMBER" --body "Approval was not accepted: only the designated review team or an organization owner may publish this submission."
      - name: Checkout for reviewed import
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && steps.authorization.outputs.authorized == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && steps.authorization.outputs.authorized == 'true' }}
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && steps.authorization.outputs.authorized == 'true' }}
        with:
          python-version: '3.12'
      - name: Import, validate, and publish
        id: publish
        if: ${{ github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && steps.authorization.outputs.authorized == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_BOT_ID: ${{ steps.bot.outputs.id }}
          ELPA_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          python -m pip install -r requirements.txt
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B submission-publication origin/main
            git reset --hard origin/main
            git clean -fd -- question-bank/
            node scripts/import-completed-submission.cjs
            git add -A -- question-bank/
            if git diff --cached --quiet; then exit 0; fi
            node scripts/check-submission-diff.cjs
            python preview.py --build-only
            node --test
            git commit -m "docs: publish reviewed ELPA issue #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; retrying clean import (${attempt}/3)"
            sleep 2
          done
          echo "Unable to publish after concurrent updates" >&2
          exit 1
      - name: Synchronize publication status
        if: ${{ success() && github.event.action != 'opened' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_AUTHORIZED: ${{ steps.authorization.outputs.authorized }}
          RECORDED: ${{ steps.publish.outputs.recorded }}
          EVENT_ACTION: ${{ github.event.action }}
          CLOSE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_ACTION" == reopened ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-label submission:pending --remove-label submission:failed || true
          elif [[ "$CLOSE_REASON" == completed && "$REVIEW_AUTHORIZED" == true && "$RECORDED" == true ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-label submission:published --remove-label submission:pending || true
          elif [[ "$CLOSE_REASON" != completed ]]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label submission:pending || true
          fi
      - name: Report import failure
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label submission:failed --remove-label submission:pending || true
          gh issue comment "$ISSUE_NUMBER" --body "Publication failed. Review the [workflow run](${RUN_URL}) and retry after correction."
